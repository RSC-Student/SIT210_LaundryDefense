<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Station Control</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-top: 40px;}
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 350px; margin-bottom: 15px; box-sizing: border-box;}
        .grid-card { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .data-box { background: #f8f8fa; padding: 15px; border-radius: 12px; text-align: center;}
        .sensor-val { font-size: 24px; font-weight: bold; color: #1c1c1e; margin-top: 5px; }
        .sensor-label { font-size: 12px; color: #8e8e93; font-weight: 700; text-transform: uppercase;}
        
        h3 { margin-top: 0; color: #1c1c1e; font-size: 16px; text-align: center;}
        .btn { width: 100%; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 5px 0; border: 2px solid transparent; transition: 0.2s;}
        
        /* Button States */
        .btn-active { background: #007aff; color: white; }
        .btn-inactive { background: #e5e5ea; color: #8e8e93; }
        .btn-alert { background: #ff3b30; color: white; }
        
        #status { font-size: 12px; color: #8e8e93; margin-bottom: 15px;}
        .disabled-text { color: #d1d1d6 !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

    <div id="status">Connecting to Cloud...</div>

    <div class="card grid-card">
        <div class="data-box">
            <div class="sensor-label">Rain Status</div>
            <div class="sensor-val" id="val-rain">--</div>
        </div>
        <div class="data-box">
            <div class="sensor-label">Temperature</div>
            <div class="sensor-val" id="val-temp">-- °C</div>
        </div>
        <div class="data-box" style="grid-column: span 2;">
            <div class="sensor-label">Humidity</div>
            <div class="sensor-val" id="val-hum">-- %</div>
        </div>
    </div>

    <div class="card">
        <h3>Command Center</h3>
        <button id="btn-mode" class="btn btn-inactive" onclick="toggleMode()">Mode: AUTO</button>
        <button id="btn-th" class="btn btn-active" onclick="toggleTH()">Sensors: ON</button>
        
        <div id="servo-controls" style="margin-top: 15px; display: none;">
            <h3 style="font-size: 14px; color: #8e8e93;">Manual Servo Control</h3>
            <div style="display: flex; gap: 10px;">
                <button id="btn-open" class="btn btn-inactive" onclick="setServo('OPEN')">OPEN</button>
                <button id="btn-close" class="btn btn-active" onclick="setServo('CLOSE')">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        const BROKER = "8c3b26b925da44b5aafe2aa93e6d94d5.s1.eu.hivemq.cloud"; 
        const PORT = 8884; 
        const USERNAME = "RSC_Project";
        const PASSWORD = "10141014";
        
        let currentMode = "AUTO";
        let thEnabled = true;

        const client = new Paho.MQTT.Client(BROKER, PORT, "/mqtt", "iphone_" + Math.random().toString(16).substr(2, 8));

        client.onConnectionLost = () => { 
            document.getElementById("status").innerText = 'Disconnected. Retrying...'; 
            setTimeout(connect, 2000); 
        };
        
        client.onMessageArrived = (msg) => { 
            const topic = msg.destinationName;
            const payload = msg.payloadString;

            // Update Sensors
            if (topic === "home/sensors/temp") document.getElementById("val-temp").innerText = payload + " °C";
            if (topic === "home/sensors/humidity") document.getElementById("val-hum").innerText = payload + " %";
            
            if (topic === "home/sensors/rain") {
                const rainEl = document.getElementById("val-rain");
                if (payload === "1") { rainEl.innerText = "WET 🌧️"; rainEl.style.color = "#ff3b30"; } 
                else { rainEl.innerText = "DRY ☀️"; rainEl.style.color = "#007aff"; }
            }

            // Sync with Pi Button Presses
            if (topic === "home/system/mode") {
                currentMode = payload;
                const modeBtn = document.getElementById("btn-mode");
                const servoBox = document.getElementById("servo-controls");
                
                if (currentMode === "MANUAL") {
                    modeBtn.innerText = "Mode: MANUAL";
                    modeBtn.className = "btn btn-alert";
                    servoBox.style.display = "block"; // Show manual controls
                } else {
                    modeBtn.innerText = "Mode: AUTO";
                    modeBtn.className = "btn btn-inactive";
                    servoBox.style.display = "none"; // Hide manual controls
                }
            }

            if (topic === "home/system/th") {
                thEnabled = (payload === "ON");
                const thBtn = document.getElementById("btn-th");
                if (thEnabled) {
                    thBtn.innerText = "Sensors: ON";
                    thBtn.className = "btn btn-active";
                    document.getElementById("val-temp").classList.remove("disabled-text");
                    document.getElementById("val-hum").classList.remove("disabled-text");
                } else {
                    thBtn.innerText = "Sensors: OFF";
                    thBtn.className = "btn btn-inactive";
                    document.getElementById("val-temp").innerText = "OFF";
                    document.getElementById("val-hum").innerText = "OFF";
                    document.getElementById("val-temp").classList.add("disabled-text");
                    document.getElementById("val-hum").classList.add("disabled-text");
                }
            }

            if (topic === "home/system/servo") {
                document.getElementById("btn-open").className = (payload === "OPEN") ? "btn btn-active" : "btn btn-inactive";
                document.getElementById("btn-close").className = (payload === "CLOSE") ? "btn btn-active" : "btn btn-inactive";
            }
        };

        // Outbound Commands
        function publishCmd(topic, msg) {
            const message = new Paho.MQTT.Message(msg);
            message.destinationName = topic;
            message.retained = true; // Tells HiveMQ to remember this state for new devices
            client.send(message);
        }

        function toggleMode() { publishCmd("home/system/mode", currentMode === "AUTO" ? "MANUAL" : "AUTO"); }
        function toggleTH() { publishCmd("home/system/th", thEnabled ? "OFF" : "ON"); }
        function setServo(state) { publishCmd("home/system/servo", state); }

        function connect() {
            client.connect({
                useSSL: true, userName: USERNAME, password: PASSWORD,
                onSuccess: () => {
                    document.getElementById("status").innerText = 'Live Synced via Cloud';
                    client.subscribe("home/sensors/#"); 
                    client.subscribe("home/system/#"); // Listen to the Pi!
                },
                onFailure: (err) => { console.error("HiveMQ Connection Failed: ", err.errorMessage); setTimeout(connect, 2000); }
            });
        }
        connect();
    </script>
</body>
</html>
